
name: Package BouncyChoice macOS Intel DMG (prebuilt)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-mac:
    runs-on: macos-15

    steps:
      # STEP 1 - Download and extract the Intel macOS build
      - name: Download and extract Intel macOS build
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p build/input

          echo "Downloading BouncyChoice Intel build..."

          gh release download v1.0.0 \
            --repo "$GH_REPOSITORY" \
            --pattern "BouncyChoice-macOS-Intel-build-input.zip" \
            --dir build

          echo "Extracting Intel build ZIP..."

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from shutil import copyfileobj
          from zipfile import ZipFile

          archive_path = Path("build/BouncyChoice-macOS-Intel-build-input.zip")
          output_dir = Path("build/input")

          with ZipFile(archive_path) as archive:
              for entry in archive.infolist():
                  normalized = entry.filename.replace("\\", "/")
                  path = PurePosixPath(normalized)

                  if path.is_absolute() or ".." in path.parts:
                      raise ValueError(f"Unsafe ZIP path: {entry.filename}")

                  destination = output_dir.joinpath(*path.parts)

                  if entry.is_dir() or normalized.endswith("/"):
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)

                      with archive.open(entry) as source:
                          with destination.open("wb") as target:
                              copyfileobj(source, target)
          PY

          echo "Checking extracted files..."

          test -f build/input/publish/BouncyChoice
          test -f build/input/Info.plist

          plutil -lint build/input/Info.plist

          echo "Intel build input extracted!"

      # STEP 2 - Verify Intel executable architecture
      - name: Verify Intel x86_64 architecture
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking executable architecture..."

          file build/input/publish/BouncyChoice

          lipo -archs build/input/publish/BouncyChoice

          lipo build/input/publish/BouncyChoice -verify_arch x86_64

          echo "Intel x86_64 architecture verified!"

      # STEP 3 - Create the macOS application bundle
      - name: Create BouncyChoice.app
        shell: bash
        run: |
          set -euo pipefail

          APP="build/BouncyChoice.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          echo "Copying application files..."

          cp -R build/input/publish/. "$APP/Contents/MacOS/"
          cp build/input/Info.plist "$APP/Contents/Info.plist"

          chmod +x "$APP/Contents/MacOS/BouncyChoice"

          echo "Checking Info.plist..."

          plutil -lint "$APP/Contents/Info.plist"

          echo "Applying ad-hoc code signature..."

          codesign --force --deep --sign - "$APP"

          codesign --verify --deep "$APP"

          echo "BouncyChoice Intel app created!"

      # STEP 4 - Create the Intel macOS DMG
      - name: Create macOS Intel DMG
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/dmg-content
          mkdir -p build/output

          echo "Preparing Intel DMG..."

          ditto \
            build/BouncyChoice.app \
            build/dmg-content/BouncyChoice.app

          ln -s /Applications build/dmg-content/Applications

          echo "Creating Intel DMG..."

          hdiutil create \
            -volname "BouncyChoice Intel" \
            -srcfolder build/dmg-content \
            -format UDZO \
            -ov \
            build/output/BouncyChoice-v1.0.0-macOS-Intel.dmg

          echo "Intel DMG created successfully!"

      # STEP 5 - Upload finished Intel DMG
      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: BouncyChoice-macOS-Intel-DMG
          path: build/output/*.dmg
          if-no-files-found: error
          retention-days: 30
